# Lighthouse CI — SEO master plan Step 9 (file only).
#
# Manual dispatch only for now: it is NOT wired into push/schedule until CI
# credentials and a deploy target exist, so nothing runs by accident. Run it
# from the Actions tab against any deployed URL (defaults to production).
#
# Usage: Actions → Lighthouse CI → Run workflow → set the Target URL.

name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Deployed URL to audit"
        required: false
        default: "https://repairkl.com"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.inputs.target_url || 'https://repairkl.com' }}
          # Budgets from the SEO plan: CWV + SEO gates.
          # TODO(Step 14): raise temporary-public-storage to a real LHCI
          # server or GCS bucket once a reporting target is chosen.
          temporary-public-storage: true
          configPath: ./lighthouserc.json
